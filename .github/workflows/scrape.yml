name: SF6 Frame Scraper

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * *'

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Gitプッシュの権限を付与
    steps:
      - name: リポジトリのコードをチェックアウト
        uses: actions/checkout@v4

      - name: Node.jsのセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: パッケージのインストール
        run: npm install

      - name: Playwrightとブラウザ(Chromium)のインストール
        run: npx playwright install --with-deps chromium

      - name: スクレイピングの実行
        run: xvfb-run --auto-servernum node src/scrape.js --force

      - name: 変更されたJSONを自動コミットしてプッシュ
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add output/frame-data.json
          git commit -m "Auto-update frame data JSON" || echo "No changes to commit"
          git push